name: Deploy to Hetzner VPS

on:
  push:
    branches: [main, claude/youtube-content-automation-SPYq5]
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/youtube-engine

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            # Ensure deploy directory exists
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # Clone or pull latest code
            BRANCH="${{ github.ref_name }}"
            if [ -d ".git" ]; then
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone -b "$BRANCH" ${{ github.server_url }}/${{ github.repository }}.git .
            fi

            # Copy environment file if it exists
            if [ -f /opt/youtube-engine/.env.production ]; then
              cp /opt/youtube-engine/.env.production infra/.env
            fi

            # Build and deploy containers
            cd infra
            docker compose pull
            docker compose build --no-cache engine
            docker compose up -d --remove-orphans

            # Wait for health check
            echo "Waiting for services to start..."
            sleep 10

            # Verify engine is healthy
            for i in $(seq 1 6); do
              if curl -sf http://localhost:80/api/health > /dev/null 2>&1; then
                echo "Engine is healthy!"
                break
              fi
              if [ "$i" -eq 6 ]; then
                echo "Health check failed after 60s"
                docker compose logs --tail=50 engine
                exit 1
              fi
              echo "Attempt $i/6 - waiting 10s..."
              sleep 10
            done

            # Cleanup old Docker images
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Container Status ==="
            cd /opt/youtube-engine/infra
            docker compose ps
            echo ""
            echo "=== Disk Usage ==="
            df -h /
            echo ""
            echo "=== Memory Usage ==="
            free -h
